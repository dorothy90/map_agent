# OpenWiki Update — Bitbucket Pipelines port of .github/workflows/openwiki-update.yml
#
# Scheduling: Bitbucket schedules are NOT defined in this file. After merging,
# go to Repository settings -> Pipelines -> Schedules and add a schedule that
# runs the "openwiki-update" custom pipeline (e.g. daily 08:00 UTC = 17:00 KST).
# You can also run it on demand: Pipelines -> Run pipeline -> Custom: openwiki-update.
#
# Required repository variables (Repository settings -> Pipelines -> Repository variables):
#   OPENROUTER_API_KEY       (secured)  — OpenRouter key
#   LANGSMITH_API_KEY        (secured)  — optional, for tracing
#   BITBUCKET_ACCESS_TOKEN   (secured)  — Repository Access Token with
#                                         repository:write + pullrequest:write,
#                                         used to push the branch and open the PR
# BITBUCKET_WORKSPACE and BITBUCKET_REPO_SLUG are provided automatically by Bitbucket.

image: node:22

pipelines:
  custom:
    openwiki-update:
      - step:
          name: Run OpenWiki and open update PR
          script:
            - npm install --global openwiki
            # Generate/refresh docs. Env mirrors the GitHub workflow.
            - export OPENWIKI_MODEL_ID="z-ai/glm-5.2"
            - export LANGCHAIN_PROJECT="openwiki"
            - export LANGCHAIN_TRACING_V2="true"
            - openwiki --update --print
            # Commit changed docs to a branch and open a PR only if there are changes.
            - |
              set -e
              BRANCH="openwiki/update"
              git config user.name "openwiki-bot"
              git config user.email "openwiki-bot@users.noreply.bitbucket.org"
              git checkout -B "$BRANCH"
              git add openwiki
              if git diff --cached --quiet; then
                echo "No OpenWiki changes; nothing to do."
                exit 0
              fi
              git commit -m "docs: update OpenWiki"
              git push -f \
                "https://x-token-auth:${BITBUCKET_ACCESS_TOKEN}@bitbucket.org/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}.git" \
                "$BRANCH"
              # Create the PR; a 400/409 (PR already open) is non-fatal.
              curl -sS -X POST \
                -H "Authorization: Bearer ${BITBUCKET_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/pullrequests" \
                -d "{
                      \"title\": \"docs: update OpenWiki\",
                      \"description\": \"Automated OpenWiki documentation update.\\n\\nThis PR was generated by the scheduled OpenWiki pipeline.\",
                      \"source\": { \"branch\": { \"name\": \"${BRANCH}\" } },
                      \"destination\": { \"branch\": { \"name\": \"main\" } }
                    }" \
                || echo "PR creation returned non-zero (an open PR may already exist)."
