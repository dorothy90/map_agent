services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27028:27017"
    volumes:
      - yield-agent-integration-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - yield-agent-integration-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  yield-agent-integration-mongo:
  yield-agent-integration-redis:
