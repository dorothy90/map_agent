<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>relation_tree_agent e2e</title>
<style>
body{font-family:monospace;font-size:12px;padding:16px;background:#fafafa}
.row{padding:4px 8px;margin:2px 0;border-radius:4px;background:#fff;border-left:3px solid #ddd}
.row.node_complete{border-left-color:#4d8eff}
.row.message{border-left-color:#1ab280}
.row.artifact{border-left-color:#a855f7;background:#faf5ff}
.row.status{border-left-color:#888;color:#666}
.row.thinking{border-left-color:#ccc;color:#999;font-size:11px}
.row.error{border-left-color:#e53333;background:#ffeded}
.row.done{border-left-color:#1ab280;background:#e8fff5;font-weight:bold}
#summary{padding:12px;background:#fff;border:2px solid #00ccd9;border-radius:8px;margin-bottom:12px}
.k{color:#888}
.v{color:#000;font-weight:600}
input{padding:8px;width:60%}
button{padding:8px 16px;background:#00ccd9;color:#fff;border:0;border-radius:4px;cursor:pointer}
pre{margin:4px 0;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;background:#f5f5f5;padding:8px;border-radius:4px}
</style>
</head>
<body>
<h2>relation_tree_agent e2e harness</h2>
<div>
  <input id="q" value="4SS2DPD STEP07 연관 분석 해줘">
  <button id="send">전송</button>
  <button id="reset">reset session</button>
</div>
<div id="summary"></div>
<div id="log"></div>

<script>
const BASE = "http://127.0.0.1:8001";
let SESSION = "e2e_" + Date.now();
const log = document.getElementById("log");
const summary = document.getElementById("summary");
const events = {planner_task: [], supervisor_goto: [], artifacts: [], errors: [], messages: [], nodes: []};

function row(cls, html) {
  const d = document.createElement("div");
  d.className = "row " + cls;
  d.innerHTML = html;
  log.appendChild(d);
  return d;
}

function updateSummary() {
  summary.innerHTML = `
    <div><span class="k">session:</span> <span class="v">${SESSION}</span></div>
    <div><span class="k">nodes traversed:</span> <span class="v">${events.nodes.join(" → ")}</span></div>
    <div><span class="k">artifacts:</span> <span class="v">${events.artifacts.length}</span> (${events.artifacts.map(a=>`${a.agent}/${a.artifact_type}`).join(", ")})</div>
    <div><span class="k">supervisor goto relation_tree_agent?</span> <span class="v">${events.supervisor_goto.includes("relation_tree_agent") ? "✅ YES" : "❌ NO"}</span></div>
    <div><span class="k">artifact agent=relation_tree_agent?</span> <span class="v">${events.artifacts.some(a=>a.agent==="relation_tree_agent") ? "✅ YES" : "❌ NO"}</span></div>
    <div><span class="k">errors:</span> <span class="v">${events.errors.length}</span></div>
  `;
}

async function send() {
  log.innerHTML = "";
  events.planner_task = []; events.supervisor_goto = []; events.artifacts = []; events.errors = []; events.messages = []; events.nodes = [];
  const q = document.getElementById("q").value;
  row("status", `<b>POST /chat/stream</b> session=${SESSION} q=${q}`);
  let resp;
  try {
    resp = await fetch(`${BASE}/chat/stream`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({query:q, session_id:SESSION, resume_value:null}),
    });
  } catch(e){
    row("error", `<b>fetch failed:</b> ${e.message}`);
    events.errors.push(e.message); updateSummary(); return;
  }
  if (!resp.ok) { row("error",`HTTP ${resp.status}`); events.errors.push(`HTTP ${resp.status}`); updateSummary(); return; }

  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, idx); buf = buf.slice(idx+2);
      const lines = block.split("\n");
      let ev = "message", data = "";
      for (const ln of lines) {
        if (ln.startsWith("event:")) ev = ln.slice(6).trim();
        else if (ln.startsWith("data:")) data += ln.slice(5).trim();
      }
      if (!data) continue;
      let payload;
      try { payload = JSON.parse(data); } catch { row("error",`bad json: ${data.slice(0,100)}`); continue; }
      handleEvent(ev, payload);
    }
  }
  row("done", `STREAM END`);
  updateSummary();
}

function handleEvent(ev, p) {
  const t = p.type || ev;
  if (t === "node_complete") {
    const node = p.node || "";
    events.nodes.push(node);
    row("node_complete", `<b>node_complete</b> <span class="k">node=</span><span class="v">${node}</span> step=${p.step||""}`);
    if (node === "supervisor" && events.last_message) {
      // supervisor 다음 step의 라우팅을 노드 흐름으로 추적
    }
  } else if (t === "message") {
    events.messages.push({agent:p.agent, content:p.content});
    row("message", `<b>message</b> <span class="k">agent=</span><span class="v">${p.agent}</span> <pre>${escapeHtml((p.content||"").slice(0,400))}</pre>`);
  } else if (t === "artifact") {
    events.artifacts.push({agent:p.agent, artifact_type:p.artifact_type, title:p.title, dataLen:(p.data||"").length});
    row("artifact", `<b>artifact</b> <span class="k">agent=</span><span class="v">${p.agent}</span> type=${p.artifact_type} title=${p.title} data_len=${(p.data||"").length}<pre>${escapeHtml((p.data||"").slice(0,400))}</pre>`);
  } else if (t === "status") {
    row("status", `<b>status</b> ${p.message||""} <span class="k">node=${p.node||""}</span>`);
  } else if (t === "thinking") {
    row("thinking", `<b>thinking</b> ${escapeHtml((p.content||"").slice(0,200))}`);
  } else if (t === "stream_start") {
    row("status", `<b>stream_start</b> session=${p.session_id}`);
    // node 흐름 추적: supervisor가 라우팅한 직후 다음 node_complete가 worker
  } else {
    row("status", `<b>${t}</b> <pre>${escapeHtml(JSON.stringify(p).slice(0,300))}</pre>`);
  }
  // supervisor_goto 추적: events.nodes에서 supervisor 이후 worker 노드를 보면 됨
  events.supervisor_goto = events.nodes.filter((n,i,arr) => i>0 && arr[i-1]==="supervisor" && n!=="replanner");
  updateSummary();
}

function escapeHtml(s){ return (s||"").replace(/[<>&]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;"})[c]); }

document.getElementById("send").onclick = send;
document.getElementById("reset").onclick = () => { SESSION = "e2e_" + Date.now(); updateSummary(); };
updateSummary();
</script>
</body>
</html>
