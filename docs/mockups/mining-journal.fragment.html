#browse-collections .of-rank{font-size:20px;line-height:1.4;font-weight:400;min-width:28px}
#browse-collections .of-candidate h3{font-size:var(--journal-title);line-height:1.45;font-weight:500;letter-spacing:-.35px;margin:0;word-break:keep-all;overflow-wrap:anywhere}
#browse-collections .of-meta{font-size:12px;line-height:1.6;font-weight:400;gap:6px 16px;margin:6px 0 0;align-items:center;font-variant-numeric:tabular-nums}
#browse-collections .of-meta .sh-badge{font-size:11px;font-weight:400;padding:1px 6px;line-height:1.5}
#browse-collections .of-body{margin:11px 0 0 44px;max-width:640px}
#browse-collections .of-evidencelabel{display:block;font-size:12px;line-height:1.5;font-weight:400;color:var(--bc-muted)}
#browse-collections .of-body p{font-size:var(--journal-body);font-weight:400;line-height:1.75;letter-spacing:-.1px;margin:4px 0 0;max-width:640px;word-break:normal;overflow-wrap:anywhere}
#browse-collections .bc-pagination{border-top:0;padding-top:20px;font-size:12px}
#browse-collections .bc-footer{font-size:11px;line-height:1.7;margin-top:20px}
#browse-collections .bc-dayall{font-size:12px}
#browse-collections .bc-navitem{font-size:12px}
#browse-collections .bc-check{font-size:12px}
#browse-collections .bc-filtersection>summary small{font-size:11px}
#browse-collections .bc-help{font-size:11px;line-height:1.7}
@media(max-width:800px){#browse-collections .bc-main{padding:24px 20px 30px}}
@media(max-width:520px){#browse-collections .bc-heading h2{font-size:26px}#browse-collections .bc-main{padding:22px 18px 28px}#browse-collections .of-candidatehead{flex-wrap:nowrap;gap:12px}#browse-collections .of-rank{min-width:24px;font-size:18px}#browse-collections .of-body{margin-left:36px}#browse-collections .bc-resulthead>span{display:block}#browse-collections .of-toppages>div{gap:14px}}
</style>
<script>
(()=>{
const host=document.getElementById('browse-collections'),states={};
const savedAll=window.openai?.widgetState?.privateContent?.rightFailJournal||{};
host.querySelectorAll('.bc-app').forEach(app=>{
const design=app.dataset.design;
const dates=[10,11,12].flatMap(m=>Array.from({length:30},(_,i)=>`2026-${m}-${String(30-i).padStart(2,'0')}`));
const fails=['OPEN','SHORT','LEAKAGE','RESISTANCE','BRIDGE','CONTACT'].flatMap(f=>Array.from({length:5},(_,i)=>f+'-'+String(i+1).padStart(2,'0'))),opers=['ETCH-120','CVD-210','CMP-340'];
const titles=['챔버 압력 편차','공정 온도 편차','처리 시간 편차','장비 간 조건 차이','직전 공정 이력 차이','챔버별 처리 조건 차이','공정 간 대기 시간 편차'];
const failsFor=date=>fails.slice(0,30-((30-Number(date.slice(8)))%21));
const all=dates.flatMap((date,seed)=>failsFor(date).flatMap(fail=>Array.from({length:30},(_,i)=>({id:date+'-'+fail+'-'+(i+1),date,rank:i+1,lot:`L${date.slice(5,7)}${['A','B','C'][Math.floor(i/10)]}${date.slice(8).padStart(3,'0')}`,fail,oper:opers[i%3],title:titles[i%titles.length]}))));
const saved=savedAll[design]||{};
const s={preset:'10',start:'2026-10-01',end:'2026-10-30',date:'2026-10-30',fails:['OPEN-01'],opers:[],page:0,expanded:[10],filterOpen:{fails:false,opers:false},openCandidates:[],search:{fails:'',opers:''},picked:null,panelTop:190,selected:[],selectedOnly:false,...saved};
states[design]=s;
function escapeText(text){return text.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
const option=(v,selected,label=v)=>`<option value="${v}" ${v===selected?'selected':''}>${label}</option>`;
function keep(){window.openai?.setWidgetState?.({modelContent:{rightFailJournal:states},privateContent:{rightFailJournal:states}}).catch(()=>{});}
function inPeriod(c){return c.date>=s.start&&c.date<=s.end;}
function match(c,ignore){return inPeriod(c)&&(ignore==='date'||!s.date||c.date===s.date)&&(ignore==='fail'||!s.fails.length||s.fails.includes(c.fail))&&(ignore==='oper'||!s.opers.length||s.opers.includes(c.oper));}
function normalize(){if(s.date&&!failsFor(s.date).includes(s.fails[0]))s.fails=[failsFor(s.date)[0]];s.fails=s.fails.filter(f=>fails.includes(f));s.opers=s.opers.filter(o=>opers.includes(o));if(s.date&&(!dates.includes(s.date)||s.date<s.start||s.date>s.end))s.date=null;}
function checkbox(field,value,count){return `<label class="bc-check cursor-interaction"><input type="checkbox" data-filter="${field}" value="${value}" ${s[field].includes(value)?'checked':''}><span>${value}</span><small>${count}개</small></label>`;}
function filterSection(field,label,values,ignore){const chosen=s[field],summary=!chosen.length||chosen.length===values.length?'전체':chosen.length===1?chosen[0]:chosen.length+'개 선택';return `<details class="bc-filtersection" data-filtersection="${field}" ${s.filterOpen[field]?'open':''}><summary class="cursor-interaction"><span>${label}<small>${summary}</small></span><span class="bc-filterarrow" aria-hidden="true"></span></summary>${design==='filters'?`<label class="sh-searchlabel">${label} 검색<input type="search" class="sh-filtersearch" data-search="${field}" placeholder="${label==='OPER'?'공정 코드 검색…':'FAIL 검색…'}" value="${escapeText(s.search[field])}" autocomplete="off"></label>`:''}<div class="bc-checks" role="group" aria-label="${label} 복수 선택">${values.map(v=>`<div data-search-option="${v}" ${!v.toLowerCase().includes(s.search[field].toLowerCase())?'hidden':''}>${checkbox(field,v,all.filter(c=>match(c,ignore)&&c[ignore]===v).length)}</div>`).join('')}</div>${design==='filters'?`<p class="sh-search-empty" ${values.some(v=>v.toLowerCase().includes(s.search[field].toLowerCase()))?'hidden':''} role="status">검색 결과가 없습니다.</p>`:''}<p class="bc-filterhint">선택하지 않으면 전체 ${label}</p></details>`;}
function sidebar(){const available=dates.filter(d=>d>=s.start&&d<=s.end),dateMatches=all.filter(c=>match(c,'date'));
return `<aside class="bc-sidebar"><h3>마이닝 아카이브</h3><p class="bc-sidebarintro">날짜 · OPER 선택</p><div class="bc-period"><label>조회 기간<select data-field="preset">${option('all',s.preset,'10~12월 전체')}${[10,11,12].map(m=>option(String(m),s.preset,m+'월')).join('')}${option('custom',s.preset,'직접 지정')}</select></label><div class="bc-dateinputs" ${s.preset==='custom'?'':'hidden'}><label>시작일<input type="date" data-field="start" value="${s.start}" min="2026-10-01" max="2026-12-30"></label><label>종료일<input type="date" data-field="end" value="${s.end}" min="2026-10-01" max="2026-12-30"></label></div><p class="bc-periodnote">${s.start.replaceAll('-','.')} — ${s.end.replaceAll('-','.')}</p></div>${filterSection('opers','OPER',opers,'oper')}<div class="bc-navtitle"><span>날짜</span><span>${available.length}일</span></div><button type="button" class="bc-navitem" data-date="all" aria-pressed="${!s.date}"><span>기간 내 모든 날짜</span><span>${dateMatches.length}개</span></button>${[10,11,12].filter(m=>available.some(d=>Number(d.slice(5,7))===m)).map(m=>`<details class="bc-month" data-month="${m}" ${s.expanded.includes(m)?'open':''}><summary class="cursor-interaction">2026년 ${m}월 <span>${available.filter(d=>Number(d.slice(5,7))===m).length}일</span></summary><nav class="bc-monthnav" aria-label="${m}월 날짜 선택">${available.filter(d=>Number(d.slice(5,7))===m).map(d=>`<button type="button" class="bc-navitem" data-date="${d}" aria-pressed="${s.date===d}"><span>${m}월 ${Number(d.slice(8))}일</span><span>${failsFor(d).length} FAIL</span></button>`).join('')}</nav></details>`).join('')}<p class="bc-help">날짜를 고른 후 오른쪽에서 FAIL을 선택하세요. OPER로 후보를 좁힐 수 있습니다.</p></aside>`;}
function failRail(){const values=s.date?failsFor(s.date):fails;return `<aside class="bc-failrail" aria-label="선택 날짜의 FAIL"><h3>이 날짜의 FAIL <span>${values.length}</span></h3><p>${s.date||'조회 기간 전체'} · FAIL당 후보 30개</p><nav aria-label="FAIL 선택">${values.map(f=>`<button type="button" class="bc-navitem" data-fail="${f}" aria-pressed="${s.fails.includes(f)}"><span>${f}</span><span>30</span></button>`).join('')}</nav></aside>`;}
function chip(kind,value,label){return `<button type="button" class="bc-chip" data-remove="${kind}" data-value="${value}" aria-label="${label} 조건 해제">${label}<span aria-hidden="true">×</span></button>`;}
function chips(){return s.opers.length?`<div class="bc-selectedfilters"><span class="bc-conditionlabel">선택 조건</span>${s.opers.map(o=>chip('opers',o,'OPER '+o)).join('')}</div>`:'';}
function evidence(c){return `<div class="bc-evidence"><strong>후보 선정 근거 · 예시</strong>${c.date}의 ${c.lot}에서 ${c.fail} 결과와 ${c.oper} 공정 조건을 함께 확인할 후보입니다. ${c.title}를 검토하는 상황을 가정했습니다.<br><br>실제 화면에서는 mining agent가 반환한 분석 근거를 표시합니다.</div>`;}
function rowContents(c){return `<span class="bc-rank">${String(c.rank).padStart(2,'0')}</span><span class="bc-titlecell"><strong>${c.title}</strong>${!s.date?`<small>${c.date}</small>`:''}</span><span class="bc-fields"><span class="bc-lotcell">${c.lot}</span><span class="bc-failcell"><span class="sh-badge">${c.fail}</span></span><span class="bc-opercell">${c.oper}</span></span><span class="bc-chevron" aria-hidden="true"></span>`;}
function candidate(c){return `<article class="of-candidate ${s.selected.includes(c.id)?'of-selected':''}" data-candidate-id="${c.id}"><header class="of-candidatehead"><span class="of-rank">${String(c.rank).padStart(2,'0')}</span><div><h3>${c.title}</h3><p class="of-meta"><span>${c.lot}</span><span class="sh-badge">${c.fail}</span><span>${c.oper}</span>${!s.date?`<span>${c.date}</span>`:''}</p></div>${design==='review'?`<label class="of-pick"><input type="checkbox" data-select="${c.id}" ${s.selected.includes(c.id)?'checked':''}> 관심 후보</label>`:''}</header><div class="of-body"><span class="of-evidencelabel">선정 근거</span><p>${c.date}의 ${c.lot}에서 ${c.fail} 결과와 ${c.oper} 공정 조건을 함께 확인할 후보입니다. ${c.title}를 검토하는 상황을 가정했습니다.</p></div></article>`;}
let viewRows=[];
function listing(rows){return `${design==='review'?`<div class="sh-reviewbar"><span aria-live="polite">관심 후보 <strong>${s.selected.length}개</strong></span><button type="button" data-selected-only="true" aria-pressed="${s.selectedOnly}" ${!s.selected.length&&!s.selectedOnly?'disabled':''}>${s.selectedOnly?'전체 후보로 돌아가기':'관심 후보만 보기'}</button><button type="button" data-selection-clear="true" ${!s.selected.length?'disabled':''}>선택 해제</button></div>`:''}<section class="of-list" aria-label="근거가 모두 열린 후보 목록">${rows.map(candidate).join('')}</section>`;}
function render(){normalize();let rows=all.filter(c=>match(c));if(design==='review'&&s.selectedOnly)rows=rows.filter(c=>s.selected.includes(c.id));if(design==='sheet'&&s.picked&&!rows.some(c=>c.id===s.picked))s.picked=null;const base=all.filter(c=>inPeriod(c)&&(!s.date||c.date===s.date)&&s.fails.includes(c.fail)),lots=[...new Set(rows.map(c=>c.lot))],pages=Math.ceil(rows.length/15);s.page=Math.max(0,Math.min(s.page,pages-1));const pageRows=rows.slice(s.page*15,s.page*15+15);viewRows=pageRows;const title=s.date?`${Number(s.date.slice(5,7))}월 ${Number(s.date.slice(8))}일의 기록`:'기간별 마이닝 기록';
app.innerHTML=`<header class="bc-top"><div class="bc-logo">mining.</div><span>The collection journal</span></header><div class="bc-shell">${sidebar()}<main class="bc-main"><div class="bc-heading"><div><h2>${title}</h2><p class="bc-context">${s.date?'선택 날짜 '+s.date:'조회 기간 '+s.start+' — '+s.end} &nbsp;·&nbsp; ${lots.length} LOT &nbsp;·&nbsp; 예시 데이터</p></div><button type="button" class="bc-dayall" data-dayall="true" ${!s.date?'disabled':''}>${s.date?'이 FAIL 전체 '+base.length+'개 보기':'당일 전체 보기'}</button></div>${chips()}${s.start>s.end?'<p class="bc-alert" role="alert">종료일을 시작일 이후로 선택해주세요.</p>':''}<div class="bc-resulthead"><h3>${s.fails[0]} 후보 <span class="bc-total" aria-live="polite">${rows.length}${rows.length!==base.length?' / '+base.length:''}개</span></h3><span>${s.date?'RANK 순 · 근거 전체 펼침 · 페이지당 15개':'날짜 내림차순 · 날짜별 RANK 순'}</span></div>${pages>1?`<nav class="of-toppages" aria-label="후보 페이지"><span>${s.page*15+1}–${Math.min(s.page*15+15,rows.length)} / ${rows.length}개</span><div><button type="button" data-page="-1" ${s.page===0?'disabled':''}>← 이전</button><span>${s.page+1} / ${pages}페이지</span><button type="button" data-page="1" ${s.page+1>=pages?'disabled':''}>다음 →</button></div></nav>`:''}${rows.length?listing(pageRows):'<div class="bc-empty"><strong>선택한 조건에 맞는 후보가 없습니다.</strong>조건을 해제하거나 조회 기간을 넓혀보세요.<button type="button" data-dayall="true">'+(s.date?'이 날짜의 전체 후보 보기 →':'현재 기간의 필터 해제 →')+'</button></div>'}${pageRows.length?`<div class="bc-pagination"><span>${s.page*15+1}–${Math.min(s.page*15+15,rows.length)} / ${rows.length}개 후보</span>${pages>1?`<div><span class="of-pagenumber">${s.page+1} / ${pages}페이지</span><button type="button" data-page="-1" ${s.page===0?'disabled':''}>← 이전</button><button type="button" data-page="1" ${s.page+1>=pages?'disabled':''}>다음 →</button></div>`:'<span>현재 조건에 맞는 모든 후보를 표시했습니다.</span>'}</div>`:''}<footer class="bc-footer">2026년 10~12월 · 매월 30일 · 날짜마다 10~30개 FAIL · FAIL마다 30개 후보 · 선정 근거는 예시 데이터입니다.</footer></main>${failRail()}</div>`;
app.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));
app.querySelectorAll('[data-candidate-id]').forEach(el=>el.addEventListener('toggle',()=>{if(!el.isConnected)return;const id=el.dataset.candidateId;if(el.open&&!s.openCandidates.includes(id)){s.openCandidates=[...s.openCandidates,id].slice(-30);keep();}else if(!el.open&&s.openCandidates.includes(id)){s.openCandidates=s.openCandidates.filter(x=>x!==id);keep();}}));
app.querySelectorAll('[data-filtersection]').forEach(el=>el.addEventListener('toggle',()=>{if(!el.isConnected)return;const field=el.dataset.filtersection;if(s.filterOpen[field]!==el.open){s.filterOpen[field]=el.open;keep();}}));
app.querySelectorAll('.bc-month').forEach(el=>el.addEventListener('toggle',()=>{const m=Number(el.dataset.month);if(el.open&&!s.expanded.includes(m)){s.expanded.push(m);keep();}else if(!el.open&&s.expanded.includes(m)){s.expanded=s.expanded.filter(x=>x!==m);keep();}}));}
render();
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.read){if(design==='sheet'){s.picked=b.dataset.read;const y=b.getBoundingClientRect().top-app.getBoundingClientRect().top;s.panelTop=Math.max(160,Math.min(y,app.getBoundingClientRect().height-480));}else{s.openCandidates=s.openCandidates.includes(b.dataset.read)?s.openCandidates.filter(id=>id!==b.dataset.read):[...s.openCandidates,b.dataset.read].slice(-30);}render();keep();return;}
if(b.dataset.sheetClose){const id=s.picked;s.picked=null;render();keep();app.querySelector('[data-read="'+id+'"]')?.focus({preventScroll:true});return;}
if(b.dataset.sheetStep){const eligible=all.filter(c=>match(c)),index=eligible.findIndex(c=>c.id===s.picked),next=eligible[index+Number(b.dataset.sheetStep)];if(next)s.picked=next.id;render();keep();return;}
if(b.dataset.selectedOnly){s.selectedOnly=!s.selectedOnly;s.page=0;render();keep();return;}
if(b.dataset.selectionClear){s.selected=[];s.selectedOnly=false;render();keep();return;}
let resetPage=true;if(b.dataset.fail){s.fails=[b.dataset.fail];s.opers=[];}if(b.dataset.date)s.date=b.dataset.date==='all'?null:b.dataset.date;if(b.dataset.dayall){s.opers=[];s.selectedOnly=false;}if(b.dataset.remove){const field=b.dataset.remove;if(field==='period'){s.preset='all';s.start='2026-10-01';s.end='2026-12-30';}else if(field==='date')s.date=null;else s[field]=s[field].filter(v=>v!==b.dataset.value);}if(b.dataset.reset){s.date=null;s.fails=[];s.opers=[];if(b.dataset.reset==='all'){s.preset='all';s.start='2026-10-01';s.end='2026-12-30';}}if(b.dataset.page){s.page+=Number(b.dataset.page);resetPage=false;}if(resetPage)s.page=0;render();keep();if(b.dataset.page)app.querySelector('.bc-heading').scrollIntoView({block:'start'});});
app.addEventListener('change',e=>{const target=e.target;if(target.dataset.select){s.selected=target.checked?[...new Set([...s.selected,target.dataset.select])]:s.selected.filter(id=>id!==target.dataset.select);render();keep();return;}if(target.dataset.selectAll){const ids=viewRows.map(c=>c.id);s.selected=target.checked?[...new Set([...s.selected,...ids])]:s.selected.filter(id=>!ids.includes(id));render();keep();return;}if(target.dataset.filter){const f=target.dataset.filter;s[f]=target.checked?[...new Set([...s[f],target.value])]:s[f].filter(v=>v!==target.value);}else if(target.dataset.field){const f=target.dataset.field;if(f==='preset'){s.preset=target.value;if(s.preset==='all'){s.start='2026-10-01';s.end='2026-12-30';}else if(s.preset!=='custom'){s.start=`2026-${s.preset}-01`;s.end=`2026-${s.preset}-30`;s.expanded=[Number(s.preset)];}}else{s[f]=target.value;s.preset='custom';}}else return;s.page=0;render();keep();});
app.addEventListener('input',e=>{const field=e.target.dataset.search;if(!field)return;s.search[field]=e.target.value;const group=e.target.closest('[data-filtersection]');let visible=0;group.querySelectorAll('[data-search-option]').forEach(el=>{el.hidden=!el.dataset.searchOption.toLowerCase().includes(s.search[field].toLowerCase());if(!el.hidden)visible++;});group.querySelector('.sh-search-empty').hidden=visible>0;keep();});
app.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.picked&&!app.closest('[data-variant]').hidden){const id=s.picked;s.picked=null;render();keep();app.querySelector('[data-read="'+id+'"]')?.focus({preventScroll:true});}});
window.addEventListener('openai:set_globals',e=>{const updated=e.detail?.globals?.widgetState?.privateContent?.rightFailJournal?.[design];if(updated&&JSON.stringify(updated)!==JSON.stringify(s)){Object.assign(s,updated);render();}});

});
})();
</script>
<style>
#browse-collections .bc-shell{grid-template-columns:224px minmax(0,1fr) 190px}
#browse-collections .bc-main{width:100%;max-width:864px;justify-self:center}
#browse-collections .bc-failrail{padding:28px 14px;border-left:1px solid var(--bc-line);min-width:0}
#browse-collections .bc-failrail h3{font-size:13px;font-weight:500;margin:0 7px 5px}
#browse-collections .bc-failrail h3 span{color:var(--bc-accent);margin-left:6px}
#browse-collections .bc-failrail p{font-size:11px;color:var(--bc-muted);margin:0 7px 20px}
@media(max-width:800px){#browse-collections [data-design] .bc-shell{grid-template-columns:190px minmax(0,1fr)}#browse-collections .bc-failrail{grid-column:2;grid-row:1;border-left:0;border-bottom:1px solid var(--bc-line)}#browse-collections .bc-failrail nav{display:flex;flex-wrap:wrap;gap:4px}#browse-collections .bc-failrail .bc-navitem{width:auto;gap:10px}#browse-collections .bc-sidebar{grid-row:1 / span 2}#browse-collections .bc-main{grid-column:2}}
@media(max-width:520px){#browse-collections [data-design] .bc-shell{display:flex;flex-direction:column}#browse-collections .bc-sidebar{order:0}#browse-collections .bc-failrail{order:1}#browse-collections .bc-main{order:2}}
</style>
