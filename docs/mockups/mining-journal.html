&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

      typeof nextState !== &quot;object&quot; ||

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,

    };

      new CustomEvent(&quot;openai:set_globals&quot;, {

      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

&lt;script&gt;
(()=&gt;{
const host=document.getElementById(&#x27;browse-collections&#x27;),states={};
const savedAll=window.openai?.widgetState?.privateContent?.rightFailJournal||{};
host.querySelectorAll(&#x27;.bc-app&#x27;).forEach(app=&gt;{
const design=app.dataset.design;
const dates=[10,11,12].flatMap(m=&gt;Array.from({length:30},(_,i)=&gt;`2026-${m}-${String(30-i).padStart(2,&#x27;0&#x27;)}`));
const fails=[&#x27;OPEN&#x27;,&#x27;SHORT&#x27;,&#x27;LEAKAGE&#x27;,&#x27;RESISTANCE&#x27;,&#x27;BRIDGE&#x27;,&#x27;CONTACT&#x27;].flatMap(f=&gt;Array.from({length:5},(_,i)=&gt;f+&#x27;-&#x27;+String(i+1).padStart(2,&#x27;0&#x27;))),opers=[&#x27;ETCH-120&#x27;,&#x27;CVD-210&#x27;,&#x27;CMP-340&#x27;];
const titles=[&#x27;챔버 압력 편차&#x27;,&#x27;공정 온도 편차&#x27;,&#x27;처리 시간 편차&#x27;,&#x27;장비 간 조건 차이&#x27;,&#x27;직전 공정 이력 차이&#x27;,&#x27;챔버별 처리 조건 차이&#x27;,&#x27;공정 간 대기 시간 편차&#x27;];
const failsFor=date=&gt;fails.slice(0,30-((30-Number(date.slice(8)))%21));
const all=dates.flatMap((date,seed)=&gt;failsFor(date).flatMap(fail=&gt;Array.from({length:30},(_,i)=&gt;({id:date+&#x27;-&#x27;+fail+&#x27;-&#x27;+(i+1),date,rank:i+1,lot:`L${date.slice(5,7)}${[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;][Math.floor(i/10)]}${date.slice(8).padStart(3,&#x27;0&#x27;)}`,fail,oper:opers[i%3],title:titles[i%titles.length]}))));
const saved=savedAll[design]||{};
const s={preset:&#x27;10&#x27;,start:&#x27;2026-10-01&#x27;,end:&#x27;2026-10-30&#x27;,date:&#x27;2026-10-30&#x27;,fails:[&#x27;OPEN-01&#x27;],opers:[],page:0,expanded:[10],filterOpen:{fails:false,opers:false},openCandidates:[],search:{fails:&#x27;&#x27;,opers:&#x27;&#x27;},picked:null,panelTop:190,selected:[],selectedOnly:false,...saved};
states[design]=s;
function escapeText(text){return text.replaceAll(&#x27;&amp;&#x27;,&#x27;&amp;amp;&#x27;).replaceAll(&#x27;&quot;&#x27;,&#x27;&amp;quot;&#x27;).replaceAll(&#x27;&lt;&#x27;,&#x27;&amp;lt;&#x27;).replaceAll(&#x27;&gt;&#x27;,&#x27;&amp;gt;&#x27;);}
const option=(v,selected,label=v)=&gt;`&lt;option value=&quot;${v}&quot; ${v===selected?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${label}&lt;/option&gt;`;
function keep(){window.openai?.setWidgetState?.({modelContent:{rightFailJournal:states},privateContent:{rightFailJournal:states}}).catch(()=&gt;{});}
function inPeriod(c){return c.date&gt;=s.start&amp;&amp;c.date&lt;=s.end;}
function match(c,ignore){return inPeriod(c)&amp;&amp;(ignore===&#x27;date&#x27;||!s.date||c.date===s.date)&amp;&amp;(ignore===&#x27;fail&#x27;||!s.fails.length||s.fails.includes(c.fail))&amp;&amp;(ignore===&#x27;oper&#x27;||!s.opers.length||s.opers.includes(c.oper));}
function normalize(){if(s.date&amp;&amp;!failsFor(s.date).includes(s.fails[0]))s.fails=[failsFor(s.date)[0]];s.fails=s.fails.filter(f=&gt;fails.includes(f));s.opers=s.opers.filter(o=&gt;opers.includes(o));if(s.date&amp;&amp;(!dates.includes(s.date)||s.date&lt;s.start||s.date&gt;s.end))s.date=null;}
function checkbox(field,value,count){return `&lt;label class=&quot;bc-check cursor-interaction&quot;&gt;&lt;input type=&quot;checkbox&quot; data-filter=&quot;${field}&quot; value=&quot;${value}&quot; ${s[field].includes(value)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;${value}&lt;/span&gt;&lt;small&gt;${count}개&lt;/small&gt;&lt;/label&gt;`;}
function filterSection(field,label,values,ignore){const chosen=s[field],summary=!chosen.length||chosen.length===values.length?&#x27;전체&#x27;:chosen.length===1?chosen[0]:chosen.length+&#x27;개 선택&#x27;;return `&lt;details class=&quot;bc-filtersection&quot; data-filtersection=&quot;${field}&quot; ${s.filterOpen[field]?&#x27;open&#x27;:&#x27;&#x27;}&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span&gt;${label}&lt;small&gt;${summary}&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;bc-filterarrow&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/summary&gt;${design===&#x27;filters&#x27;?`&lt;label class=&quot;sh-searchlabel&quot;&gt;${label} 검색&lt;input type=&quot;search&quot; class=&quot;sh-filtersearch&quot; data-search=&quot;${field}&quot; placeholder=&quot;${label===&#x27;OPER&#x27;?&#x27;공정 코드 검색…&#x27;:&#x27;FAIL 검색…&#x27;}&quot; value=&quot;${escapeText(s.search[field])}&quot; autocomplete=&quot;off&quot;&gt;&lt;/label&gt;`:&#x27;&#x27;}&lt;div class=&quot;bc-checks&quot; role=&quot;group&quot; aria-label=&quot;${label} 복수 선택&quot;&gt;${values.map(v=&gt;`&lt;div data-search-option=&quot;${v}&quot; ${!v.toLowerCase().includes(s.search[field].toLowerCase())?&#x27;hidden&#x27;:&#x27;&#x27;}&gt;${checkbox(field,v,all.filter(c=&gt;match(c,ignore)&amp;&amp;c[ignore]===v).length)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${design===&#x27;filters&#x27;?`&lt;p class=&quot;sh-search-empty&quot; ${values.some(v=&gt;v.toLowerCase().includes(s.search[field].toLowerCase()))?&#x27;hidden&#x27;:&#x27;&#x27;} role=&quot;status&quot;&gt;검색 결과가 없습니다.&lt;/p&gt;`:&#x27;&#x27;}&lt;p class=&quot;bc-filterhint&quot;&gt;선택하지 않으면 전체 ${label}&lt;/p&gt;&lt;/details&gt;`;}

  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
